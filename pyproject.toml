[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "olist-marketplace-analytics"
version = "0.1.0"
description = "Evidence-first marketplace analytics using the Olist dataset"
requires-python = ">=3.11"
dependencies = [
  "duckdb>=1.2,<2", "pandas>=2.2,<4", "numpy>=2,<3",
  "streamlit>=1.42,<2", "plotly>=6,<7", "scikit-learn>=1.6,<2",
  "scipy>=1.15,<2", "joblib>=1.4,<2", "statsmodels>=0.14,<1", "requests>=2.31,<3"
]

[project.scripts]
olist = "marketplace.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
